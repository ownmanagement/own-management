<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWN — Estudio de Arquitectura</title>
  
  <style>
    /* Carga de tipografías optimizada */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Syne:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
      color: #0f0f0f;
      overflow-x: hidden;
      width: 100vw;
    }

    button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    /* --- NAV --- */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 6vw;
      z-index: 10000;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }

    .brand-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .nav-menu { display: flex; gap: 4rem; }

    .nav-item {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: #888;
      transition: color 0.4s;
    }

    .nav-item:hover, .nav-item.active { color: #000; }

    /* --- SECCIONES --- */
    .page-section {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s, visibility 0.8s;
      overflow-y: auto;
    }

    .page-section.active { opacity: 1; visibility: visible; z-index: 2; }

    /* --- HOME --- */
    #section-home { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }

    .hero-title-interactive {
      font-family: 'Syne', sans-serif;
      font-size: clamp(7rem, 28vw, 24rem);
      font-weight: 400;
      cursor: pointer;
      line-height: 0.8;
    }

    /* --- PROYECTOS (Banner Ajustado) --- */
    .projects-hero-banner {
      width: 100vw;
      height: 90vh !important; /* Altura aumentada */
      position: relative;
      overflow: hidden;
    }

    .projects-hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%; /* Foco ligeramente arriba */
    }

    .projects-hero-caption {
      position: absolute;
      bottom: 5rem;
      left: 6vw;
      color: #fff;
      z-index: 10;
    }

    .projects-hero-caption h2 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 1;
      text-transform: uppercase;
    }

    /* --- RESTO DEL CSS --- */
    .projects-horizontal-wrapper { padding: 12vh 0; background-color: #fafafa; }
    .section-label { padding: 0 6vw 3rem 6vw; font-size: 0.65rem; letter-spacing: 0.4em; color: #a0a0a0; }
    .projects-horizontal-scroll { display: flex; width: 100vw; overflow-x: auto; padding: 0 6vw; scrollbar-width: none; }
    .project-card-fluid { flex: 0 0 auto; width: 400px; margin-right: 5vw; cursor: pointer; }
    .project-image-container { width: 100%; height: 50vh; overflow: hidden; }
    .project-image-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s; }
    .project-card-fluid:hover img { transform: scale(1.05); }

    /* --- MODAL Y LIGHTBOX (Mantienen estructura) --- */
    #project-modal { position: fixed; top:0; left:0; width:100vw; height:100vh; background:#fff; z-index:20000; opacity:0; visibility:hidden; overflow-y:auto; transition: 0.6s; }
    #project-modal.active { opacity:1; visibility:visible; }
    .modal-hero-img { width: 100vw; height: 85vh; object-fit: cover; }
    
    @media (max-width: 900px) {
      .projects-hero-banner { height: 60vh !important; }
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <div class="brand-logo" onclick="switchSection('home')">OWN</div>
    <div class="nav-menu">
      <button class="nav-item" id="nav-estudio" onclick="switchSection('estudio')">Estudio</button>
      <button class="nav-item" id="nav-proyectos" onclick="switchSection('proyectos')">Proyectos</button>
    </div>
  </nav>

  <section id="section-home" class="page-section active">
    <div class="hero-title-interactive" onclick="switchSection('proyectos')">OWN</div>
  </section>

  <section id="section-proyectos" class="page-section">
    <div class="projects-hero-banner">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=2000&auto=format&fit=crop" alt="OWN Architecture">
      <div class="projects-hero-caption">
        <h2>Obras Seleccionadas<br>2024—2026</h2>
      </div>
    </div>
    <div class="projects-horizontal-wrapper">
      <div class="section-label">01 / Proyectos</div>
      <div class="projects-horizontal-scroll" id="scroll-container">
         <div class="project-card-fluid" onclick="openProjectDetail(1)">
           <div class="project-image-container"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1400&auto=format&fit=crop" alt="Proyecto"></div>
         </div>
      </div>
    </div>
  </section>

  <section id="section-estudio" class="page-section">
    <!-- Contenido estudio -->
  </section>

  <script>
    function switchSection(sectionId) {
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
      document.getElementById('section-' + sectionId).classList.add('active');
    }
    function openProjectDetail(id) { document.getElementById('project-modal').classList.add('active'); }
    function closeProjectDetail() { document.getElementById('project-modal').classList.remove('active'); }
  </script>
</body>
</html>
