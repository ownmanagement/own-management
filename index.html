  <style>

    html, body {

    button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }

      justify-content: space-between; 
      align-items: center; 
      padding: 1.5rem 6vw; 
      z-index: 10000;

      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
    }
    .brand-logo { font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: #000; cursor: pointer; transition: letter-spacing 0.5s ease; }
    .brand-logo:hover { letter-spacing: 0.5em; }

    .nav-back-btn:hover { color: #000; }

    .page-section {

      width: 100vw;

      top: 0;
      left: 0;
      background-color: #ffffff;

    .page-section.active {

      z-index: 1;

    .hero-title-interactive:hover { letter-spacing: 0.02em; transform: scale(1.03); }

    /* --- 2. DIVISIÓN DE PANTALLA (MODIFICADO TITULO) --- */
    #section-split { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      position: relative; 
    }
    .split-pane { 
      flex: 1; 
      height: 100%; 
      position: relative; 
      overflow: hidden; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      padding: 6vw; 
      transition: flex 0.7s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    
    .split-pane img { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      filter: grayscale(100%) brightness(0.9); 
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease; 
      z-index: 0; 
    }
    .split-pane:hover img { 
      transform: scale(1.05); 
      filter: grayscale(0%) brightness(0.95); 
    }

    .split-pane::before { 
      content: ''; 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.25); 
      transition: background 0.6s ease; 
      z-index: 1; 
    }
    .split-pane:hover::before { 
      background: rgba(0,0,0,0.1); 
    }

    .split-content { position: relative; z-index: 2; color: #ffffff; pointer-events: none; }
    /* Título modificado a Montserrat Bold */
    .split-title { font-family: 'Montserrat', sans-serif; font-size: clamp(2rem, 4vw, 4.5rem); font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 0.5rem; transition: transform 0.4s ease; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .split-desc { 
      font-family: 'Playfair Display SC', serif; 
      font-size: 0.75rem; 
      letter-spacing: 0.25em; 
      text-transform: uppercase; 
      color: #e0e0e0; 
      opacity: 0.75; 
      max-width: 380px;
      line-height: 1.5;
      transition: opacity 0.5s ease, transform 0.5s ease; 
    }
    .split-pane:hover .split-title { transform: translateY(-4px); }
    .split-pane:hover .split-desc { opacity: 1; transform: translateY(-2px); }

    /* --- CONTENEDORES CON SCROLL --- */

    .section-inner { padding: 140px 6vw 100px 6vw; max-width: 1400px; margin: 0 auto; }
    
    /* Título principal modificado a Montserrat Bold */

    .section-intro-text { font-family: 'Playfair Display SC', serif; font-size: clamp(1rem, 1.4vw, 1.4rem); line-height: 1.6; color: #444; max-width: 800px; margin-bottom: 5rem; }
    
    /* --- EQUIPO (MODIFICADO) --- */
    /* Foto grupal arriba a ancho completo */
    .team-hero-img {
      width: 100vw;
      height: 60vh;
      object-fit: cover;
      filter: grayscale(100%);
      margin-left: -6vw; /* Para salir del contenedor .section-inner */
      margin-bottom: 5rem;
    }

    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4vw; max-width: 900px; margin: 0 auto; }
    .team-card { position: relative; text-align: center;}
    
    /* Retratos individuales redondos y más pequeños */
    .team-img-container { width: 150px; height: 150px; overflow: hidden; background: #eee; border-radius: 50%; margin: 0 auto 1rem auto; }
    .team-img-container img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: transform 1s ease, filter 0.5s ease; }
    .team-card:hover .team-img-container img { transform: scale(1.04); filter: grayscale(0%); }
    
    .team-info { margin-top: 1.2rem; }
    .team-name { font-family: 'Familjen Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; }
    .team-role { font-family: 'Playfair Display SC', serif; font-size: 0.72rem; letter-spacing: 0.15em; color: #888; margin-top: 0.3rem; text-transform: uppercase; }

    /* --- PROYECTOS (GRILLA ASIMÉTRICA DINÁMICA) --- */
    .projects-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); /* Grilla de 4 columnas */
      gap: 2vw; 
      grid-auto-rows: 300px; /* Altura base de las filas */
    }
    
    .project-item { cursor: pointer; position: relative; overflow: hidden; }
    
    /* Asimetría: Elementos que ocupan doble espacio */
    .project-item.wide { grid-column: span 2; }
    .project-item.tall { grid-row: span 2; }
    .project-item.big { grid-column: span 2; grid-row: span 2; }

    .project-thumb { width: 100%; height: 100%; } /* Ocupa todo el contenedor del grid */

    .project-item:hover .project-thumb img { transform: scale(1.04); filter: grayscale(0%); }
    
    /* Título del proyecto sobre la imagen */
    .project-card-title { 
      font-family: 'Familjen Grotesk', sans-serif; 
      font-size: 1.2rem; 
      font-weight: 700; 
      text-transform: uppercase; 
      color: white;

      bottom: 20px;
      left: 20px;
      z-index: 2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .project-card-loc {
        display: none; /* Ocultamos la ubicación en este diseño para simplificar */
    }
    .project-item:hover .project-card-title {
        opacity: 1;
    }
