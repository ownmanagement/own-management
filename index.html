<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWN — Arquitectura & Diseño</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@600&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    
    html, body { 
      font-family: 'Playfair Display SC', serif; 
      background-color: #ffffff; 
      color: #0f0f0f; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
    }

    button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; }

    /* --- NAV MINIMALISTA --- */
    .nav-bar { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 1.5rem 6vw; 
      z-index: 10000; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
    }
    .brand-logo { font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.4em; text-transform: uppercase; color: #000; cursor: pointer; transition: letter-spacing 0.5s ease; }
    .brand-logo:hover { letter-spacing: 0.5em; }
    .nav-back-btn { font-family: 'Familjen Grotesk', sans-serif; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; color: #666; transition: color 0.3s; cursor: pointer; }
    .nav-back-btn:hover { color: #000; }

    /* --- GESTIÓN DE VISTAS --- */
    .page-section { 
      display: none; 
      width: 100vw; 
      height: 100vh; 
      position: absolute;
      top: 0;
      left: 0;
      background-color: #ffffff; 
    }
    .page-section.active { 
      display: flex; 
    }

    /* --- 1. HOME CON VIDEO DE DRON/LOOP GARANTIZADO --- */
    #section-home { 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      position: relative; 
      overflow: hidden; 
      background-color: #000;
    }
    .home-bg-video { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      min-width: 100%; 
      min-height: 100%; 
      width: auto; 
      height: auto; 
      transform: translate(-50%, -50%); 
      object-fit: cover; 
      z-index: 1; 
      filter: brightness(0.55) contrast(1.1) grayscale(15%); 
    }
    .home-overlay-content { position: relative; z-index: 2; text-align: center; color: #ffffff; }
    .hero-title-interactive { font-family: 'Montserrat', sans-serif; font-size: clamp(5rem, 20vw, 18rem); font-weight: 600; letter-spacing: 0.1em; line-height: 0.8; cursor: pointer; user-select: none; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), letter-spacing: 0.6s; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .hero-title-interactive:hover { letter-spacing: 0.2em; transform: scale(1.03); }
    .hero-subtext { font-family: 'Playfair Display SC', serif; margin-top: 2rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.4em; color: #e0e0e0; }

    /* --- 2. DIVISIÓN DE PANTALLA --- */
    #section-split { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      position: relative; 
    }
    .split-pane { 
      flex: 1; 
      height: 100%; 
      position: relative; 
      overflow: hidden; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      padding: 6vw; 
      transition: flex 0.7s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    
    .split-pane img { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      filter: grayscale(100%) brightness(0.9); 
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease; 
      z-index: 0; 
    }
    .split-pane:hover img { 
      transform: scale(1.05); 
      filter: grayscale(0%) brightness(0.95); 
    }

    .split-pane::before { 
      content: ''; 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.25); 
      transition: background 0.6s ease; 
      z-index: 1; 
    }
    .split-pane:hover::before { 
      background: rgba(0,0,0,0.1); 
    }

    .split-content { position: relative; z-index: 2; color: #ffffff; pointer-events: none; }
    .split-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 4vw, 4.5rem); font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 0.5rem; transition: transform 0.4s ease; text-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    .split-desc { 
      font-family: 'Playfair Display SC', serif; 
      font-size: 0.75rem; 
      letter-spacing: 0.25em; 
      text-transform: uppercase; 
      color: #e0e0e0; 
      opacity: 0.75; 
      max-width: 380px;
      line-height: 1.5;
      transition: opacity 0.5s ease, transform 0.5s ease; 
    }
    .split-pane:hover .split-title { transform: translateY(-4px); }
    .split-pane:hover .split-desc { opacity: 1; transform: translateY(-2px); }

    /* --- CONTENEDORES CON SCROLL --- */
    .scrollable-content-wrapper {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      background-color: #ffffff;
    }

    .section-inner { padding: 140px 6vw 100px 6vw; max-width: 1400px; margin: 0 auto; }
    .section-header-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 700; text-transform: uppercase; margin-bottom: 1.5rem; }
    .section-intro-text { font-family: 'Playfair Display SC', serif; font-size: clamp(1rem, 1.4vw, 1.4rem); line-height: 1.6; color: #444; max-width: 800px; margin-bottom: 5rem; }
    
    /* --- EQUIPO --- */
    .team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vw; }
    .team-card { position: relative; }
    .team-img-container { width: 100%; height: 45vh; overflow: hidden; background: #eee; }
    .team-img-container img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: transform 1s ease, filter 0.5s ease; }
    .team-card:hover .team-img-container img { transform: scale(1.04); filter: grayscale(40%); }
    .team-info { margin-top: 1.2rem; }
    .team-name { font-family: 'Familjen Grotesk', sans-serif; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; }
    .team-role { font-family: 'Playfair Display SC', serif; font-size: 0.72rem; letter-spacing: 0.15em; color: #888; margin-top: 0.3rem; text-transform: uppercase; }

    /* --- PROYECTOS --- */
    .projects-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4vw; }
    .project-item { cursor: pointer; }
    .project-thumb { width: 100%; height: 55vh; overflow: hidden; background: #eee; margin-bottom: 1.5rem; }
    .project-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(10%); }
    .project-item:hover .project-thumb img { transform: scale(1.04); filter: grayscale(0%); }
    .project-meta-row { display: flex; justify-content: space-between; align-items: baseline; }
    .project-card-title { font-family: 'Familjen Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; }
    .project-card-loc { font-family: 'Playfair Display SC', serif; font-size: 0.75rem; letter-spacing: 0.2em; color: #777; text-transform: uppercase; }

    /* --- MODAL DE MEMORIAS --- */
    #project-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 20000; opacity: 0; visibility: hidden; overflow-y: auto; transition: opacity 0.6s ease, visibility 0.6s; pointer-events: none; }
    #project-modal.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-close-btn { font-family: 'Familjen Grotesk', sans-serif; position: fixed; top: 2rem; right: 6vw; z-index: 21000; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; padding: 0.6rem 1.4rem; background: #ffffff; border: 1px solid rgba(0,0,0,0.1); cursor: pointer; }
    .modal-hero-img { width: 100vw; height: 85vh; object-fit: cover; }
    .modal-body-full { width: 100vw; padding: 6vh 6vw 120px 6vw; max-width: 1400px; margin: 0 auto; }
    .sheet-meta-grid-full { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem; padding: 3rem 0; border-top: 1px solid rgba(0,0,0,0.08); border-bottom: 1px solid rgba(0,0,0,0.08); margin: 4rem 0; }
    .meta-box span { font-family: 'Familjen Grotesk', sans-serif; display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: #a0a0a0; font-weight: 600; }
    .meta-box strong { font-family: 'Playfair Display SC', serif; font-size: 1.1rem; margin-top: 0.5rem; display: block; }
    .sheet-grid-2-full { display: grid; grid-template-columns: 1fr 1fr; gap: 6vw; align-items: center; }
    .sheet-text-p { font-family: 'Playfair Display SC', serif; font-size: clamp(1.1rem, 1.5vw, 1.5rem); line-height: 1.7; color: #1a1a1a; }
    .sheet-sketch-img { width: 100%; height: 55vh; object-fit: cover; background-color: #f9f9f9; }

    @media (max-width: 900px) {
      #section-split { flex-direction: column; }
      .team-grid, .projects-grid, .sheet-meta-grid-full, .sheet-grid-2-full { grid-template-columns: 1fr; gap: 2rem; }
    }
  </style>
</head>
<body>
